<!doctype html>
<html lang="th" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fafafc">
    <meta name="format-detection" content="telephone=no">
    <!--head-->
    <script>
      // StaggeredFadeIn (src/staggered.js): ซ่อนกล่องไว้รอเฟด · ถ้า JS หลักไม่ทำงานใน 3 วินาที แสดงทุกอย่างตามปกติ
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('sfi');
        setTimeout(function () { if (!window.__sfiReady) document.documentElement.classList.remove('sfi'); }, 3000);
      }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  </head>

  </body>
</html>
